# Push a tag like v1.2.0 to build the addon zip and upload it to CurseForge
# and GitHub Releases. Needs the repository secret CF_API_KEY (a CurseForge
# API token) and "## X-Curse-Project-ID" in the .toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
